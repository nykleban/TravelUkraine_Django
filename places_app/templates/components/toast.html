{% if messages %}
    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
        {% for msg in messages %}
            <div
                    class="toast align-items-center text-bg-{% if msg.tags == 'error' %}danger{% elif msg.tags == 'warning' %}warning{% else %}success{% endif %} border-0"
                    role="alert"
                    aria-live="assertive"
                    aria-atomic="true"
            >
                <div class="d-flex">
                    <div class="toast-body">
                        {{ msg }}
                    </div>
                    <button
                            type="button"
                            class="btn-close {% if msg.tags != 'warning' %}btn-close-white{% endif %} me-2 m-auto"
                            data-bs-dismiss="toast"
                            aria-label="Close"
                    ></button>
                </div>
            </div>
        {% endfor %}
    </div>

    <script>
        document.querySelectorAll('.toast').forEach((toastBlock) => {
            const toastBootstrap = bootstrap.Toast.getOrCreateInstance(toastBlock);
            toastBootstrap.show();
        });
    </script>
{% endif %}
