{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>TravelUkraine</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static 'styles.css' %}"/>
    {% block styles %} {% endblock %}
</head>

<body>
<nav class="navbar navbar-expand-lg site-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'index' %}">
            TravelUkraine
            <img src="{% static 'storage/logo/gps_icon.png' %}" alt="" style="width: 25px;">
        </a>
        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="{% url 'index' %}">
                        Головна
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'place_list' %}">
                        Місця
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'search' %}">
                        Пошук
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">{% block content %} {% endblock %}</main>

<footer class="container py-4 border-top">
    <p class="text-muted mb-0">TravelUkraine - цікаві місця України.</p>
</footer>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
></script>
{% block scripts %} {% endblock %}
</body>
</html>
